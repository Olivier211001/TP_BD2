
# Oracle datasource - configure these values for your Oracle DB
spring.datasource.url=jdbc:oracle:thin:@//<HOST>:1521/<SERVICE>
spring.datasource.username=<YOUR_ORACLE_USER>
spring.datasource.password=<YOUR_ORACLE_PASSWORD>
spring.datasource.driverClassName=oracle.jdbc.OracleDriver

# If you want to use H2 for local dev, uncomment the H2 settings below
#spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# Hibernate dialect for Oracle
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Enable the interactive console runner by passing -Dapp.console.enabled=true
# Default is disabled to avoid running the console during automated tests.
# Example: mvn -Dapp.console.enabled=true spring-boot:run
# Console disabled by default; enable via Maven profile `console` or JVM arg
app.console.enabled=false
