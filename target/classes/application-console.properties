# Console profile: use in-memory H2 DB and enable console runner
app.console.enabled=true

# H2 in-memory datasource for interactive console runs
spring.datasource.url=jdbc:h2:mem:library_console;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Use create-drop for console session
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Prevent Spring from running main data.sql (we create schema via Hibernate)
spring.sql.init.mode=never
