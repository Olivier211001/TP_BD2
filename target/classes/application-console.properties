# Console profile: use in-memory H2 DB and enable console runner
app.console.enabled=true

# H2 file-based datasource for interactive console runs (persists between runs)
spring.datasource.url=jdbc:h2:file:./data/library_console;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Persist schema between runs: use 'update' so missing tables are created but data is kept
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ensure H2 dialect is used for schema generation in console profile
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Prevent Spring from running main data.sql (we create schema via Hibernate)
spring.sql.init.mode=never
